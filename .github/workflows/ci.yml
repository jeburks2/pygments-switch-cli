name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "pypy3.11"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      # Installed, not just importable: the lexers reach MkDocs through an
      # entry point, which only exists once the distribution is installed.
      - name: Install the package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install '.[test]'

      - name: Run the test suite
        run: python -m pytest -ra

      - name: Check the lexers are registered with Pygments
        run: |
          pygmentize -L lexers | grep -q 'Arista EOS'
          printf 'interface Ethernet1\n' | pygmentize -l eos -f html | grep -q 'class="nf"'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff mypy
      - run: ruff check pygments_switch_cli/ tests/
      - run: mypy --ignore-missing-imports pygments_switch_cli/

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  docs:
    name: Build the documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install '.[docs]'
      - run: mkdocs build --strict
